name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: widget-common
          - package: antigravity-usage-widget
            app: antigravity
          - package: claude-usage-widget
            app: claude
          - package: codex-usage-widget
            app: codex
          - package: kimi-usage-widget
            app: kimi
          - package: opencode-usage-widget
            app: opencode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        if: matrix.package == 'widget-common'
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy -p ${{ matrix.package }} --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test -p ${{ matrix.package }} --locked

      - name: Build executable
        if: matrix.app
        shell: pwsh
        run: .\scripts\build-release.ps1 -App ${{ matrix.app }} -Version "ci"

      - name: Upload artifact
        if: matrix.app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-unsigned
          path: releases/*UsageWidget-ci.exe
          if-no-files-found: error
