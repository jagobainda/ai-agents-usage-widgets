[workspace]
resolver = "3"
members = ["packages/widget-common", "apps/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Jagoba Inda"]

[workspace.dependencies]
widget-common = { path = "packages/widget-common" }
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
resvg = { version = "0.50.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3"
toml = "1.2.2"
tray-icon = { version = "0.26.1", default-features = false }
ureq = { version = "3.5.2", features = ["json", "platform-verifier"] }
which = "8"
winit = { version = "0.30.13", default-features = false }
winresource = "0.1.34"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
