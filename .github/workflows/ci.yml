name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and build all widgets (unsigned)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Build executables
        shell: pwsh
        run: .\scripts\build-release.ps1 -App all -Version "ci"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsageWidgets-unsigned
          path: |
            releases/ClaudeUsageWidget-ci.exe
            releases/CodexUsageWidget-ci.exe
            releases/OpenCodeUsageWidget-ci.exe
            releases/KimiUsageWidget-ci.exe
            releases/AntigravityUsageWidget-ci.exe
          if-no-files-found: error
